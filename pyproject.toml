[project]
name = "jwks-server"
version = "2.0.0"
description = "JWKS server backed by SQLite (CSCE 3550 Project 2)"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=jwks_server --cov=main --cov-report=term-missing"

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80
